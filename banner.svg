<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ray Framework — evidence-first security review pipeline, 35 skills, 4 agents, 3 tracks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c02f49"/>
      <stop offset="0.35" stop-color="#d9a441"/>
      <stop offset="0.62" stop-color="#3fb27f"/>
      <stop offset="0.85" stop-color="#255fa6"/>
      <stop offset="1" stop-color="#6a5aa8"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- incoming single ray -->
  <line x1="70" y1="150" x2="360" y2="150" stroke="url(#ray)" stroke-width="3"/>

  <!-- the prism -->
  <polygon points="360,96 360,204 452,150" fill="none" stroke="#cfd3de" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="360,96 360,204 452,150" fill="#ffffff" opacity="0.04"/>

  <!-- dispersed spectrum: the pipeline stages -->
  <g stroke-width="3" fill="none" opacity="0.95">
    <line x1="452" y1="150" x2="1130" y2="70"  stroke="#c02f49"/>
    <line x1="452" y1="150" x2="1130" y2="110" stroke="#d9a441"/>
    <line x1="452" y1="150" x2="1130" y2="150" stroke="#3fb27f"/>
    <line x1="452" y1="150" x2="1130" y2="190" stroke="#255fa6"/>
    <line x1="452" y1="150" x2="1130" y2="230" stroke="#6a5aa8"/>
  </g>

  <!-- wordmark -->
  <text x="520" y="150" font-family="'Archivo','Segoe UI',system-ui,sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#f4f5f8">Ray</text>
  <text x="522" y="196" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="21" font-weight="500" letter-spacing="7" fill="#9aa0b2">FRAMEWORK</text>

  <!-- tagline -->
  <rect x="522" y="222" width="470" height="1.5" fill="url(#spectrum)"/>
  <text x="522" y="252" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="18" fill="#c7ccd8">evidence-first security review · 35 skills · 4 agents · 3 tracks</text>
</svg>
